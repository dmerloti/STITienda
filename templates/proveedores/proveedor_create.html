{% extends 'base.html' %}

{% block content %}

<form method="post" action="{{ url_for('entidades.proveedor_guardar') }}">

<div class="card">
    <div class="card-header">
        CREAR Proveedor
    </div>

    <div class="card-body">

        <h5 class="card-title">Datos del Proveedor</h5>

        <div class="form-group">
            <label for="txtConcepto">Concepto:</label>
            <input id="txtConcepto" class="form-control campo-edicion" type="text" name="txtConcepto" required>
        </div>


        <div class="form-group">
            <label for="txtCelular">Celular:</label>
            <input id="txtCelular" class="form-control campo-edicion" type="text" name="txtCelular">
        </div>

        <div class="form-group">
            <label for="txtMail">Mail:</label>

            <input 
            id="txtMail" 
            class="form-control campo-edicion"
            type="email" 
            name="txtMail"
            value="{{ proveedor.mail if proveedor else '' }}"
            placeholder="ejemplo@email.com"
            >

            <small id="errorMail" class="text-danger"></small>

        </div>

        <div class="form-group">
            <label>Localidad</label>
            <select class="form-control campo-edicion" name="txtLocalidad">

            {% for l in localidades %}
            <option value="{{l.id}}">{{l.concepto}}</option>
            {% endfor %}

            </select>
        </div>

        <div class="form-group">
            <label for="txtDireccion">Dirección:</label>
            <input id="txtDireccion" class="form-control campo-edicion" type="text" name="txtDireccion" required>
        </div>

        <div class="form-group">
            <label>Tipo Contribuyente Fiscal:</label>

            <select class="form-control campo-edicion" name="txtTipoContribuyente">

            {% for t in tipos %}
            <option value="{{t.id}}">{{t.concepto}}</option>
            {% endfor %}

            </select>

        </div>

        <div class="form-group">
            <label for="txtCuit">CUIT:</label>

            <input 
            id="txtCuit" 
            class="form-control campo-edicion"
            type="text" 
            name="txtCuit"
            value="{{ proveedor.cuit if proveedor else '' }}"
            >

            <small id="errorCuit" class="text-danger"></small>

        </div>

        <br>

        <div class="form-group">
            <input type="submit" class="btn btn-success" value="Guardar">
            <a href="{{url_for('entidades.proveedores')}}" class="btn btn-primary">Regresar</a>
        </div>

    </div>
</div>

</form>

<script>

function validarCUIT(cuit){

    cuit = cuit.replace(/-/g,'')

    if(cuit.length != 11) return false

    let mult = [5,4,3,2,7,6,5,4,3,2]
    let total = 0

    for(let i=0;i<10;i++){
        total += parseInt(cuit[i]) * mult[i]
    }

    let resto = total % 11
    let digito = resto == 0 ? 0 : resto == 1 ? 9 : 11 - resto

    return digito == cuit[10]

}

document.getElementById("txtCuit").addEventListener("blur", function(){

    let cuit = this.value
    let error = document.getElementById("errorCuit")

    if(cuit === ""){
        error.innerText = ""
        return
    }

    if(!validarCUIT(cuit)){
        error.innerText = "CUIT inválido"
        this.classList.add("is-invalid")
    }else{
        error.innerText = ""
        this.classList.remove("is-invalid")
    }

})

</script>

<script>

function validarMail(mail){

    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    return regex.test(mail);

}

document.getElementById("txtMail").addEventListener("blur", function(){

    let mail = this.value;
    let error = document.getElementById("errorMail");

    if(mail === ""){
        error.innerText = "";
        this.classList.remove("is-invalid");
        return;
    }

    if(!validarMail(mail)){
        error.innerText = "Mail inválido";
        this.classList.add("is-invalid");
    }else{
        error.innerText = "";
        this.classList.remove("is-invalid");
    }

});

</script>

{% endblock %}

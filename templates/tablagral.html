{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">

            <h4 class="mb-0">
                Datos Generales Empresa
            </h4>

        </div>

        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('soporte.empresa_update') }}"
                  enctype="multipart/form-data">

                <!-- RAZON SOCIAL -->
                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Razón Social
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtRazonSocial"
                               value="{{ empresa.razonSocial or '' }}">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Nombre Fantasía
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtNombreFantasia"
                               value="{{ empresa.nombreFantasia or '' }}">

                    </div>

                    <!-- LEYENDA -->
                    <div class="col-md-12">

                        <label class="form-label fw-bold">
                            Leyenda
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtLeyenda"
                               value="{{ empresa.leyenda or '' }}">

                    </div>

                    <!-- FECHA INICIO -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Inicio Actividades
                        </label>

                        <input type="datetime-local"
                               class="form-control"
                               name="txtFechaInicio"
                               value="{{ empresa.fechaInicioActividades.strftime('%Y-%m-%dT%H:%M') if empresa.fechaInicioActividades else '' }}">

                    </div>

                    <!-- DIRECCION -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Dirección
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtDireccion"
                               value="{{ empresa.direccion or '' }}">

                    </div>

                    <!-- CP -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Código Postal
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtCP"
                               value="{{ empresa.cp or '' }}">

                    </div>

                    <!-- CP -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Código Postal
                        </label>

                        <input type="text"
                            class="form-control"
                            name="txtCP"
                            value="{{ empresa.cp or '' }}">

                    </div>

                    <!-- LOCALIDAD -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Localidad
                        </label>

                        <select class="form-select"
                                name="txtIdLocali">

                            <option value="0">
                                Seleccionar Localidad
                            </option>

                            {% for localidad in localidades %}

                            <option value="{{ localidad.id }}"
                                {% if empresa.idLocali == localidad.id %}
                                    selected
                                {% endif %}>

                                {{ localidad.concepto }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- CUIT -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            CUIT
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtCuit"
                               value="{{ empresa.cuit or '' }}">

                    </div>

                    <!-- IIBB -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Ingresos Brutos
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtIngresosBrutos"
                               value="{{ empresa.ingresosBrutos or '' }}">

                    </div>

                    <!-- TELEFONO 1 -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Teléfono 1
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtTelefono1"
                               value="{{ empresa.telefono1 or '' }}">

                    </div>

                    <!-- TELEFONO 2 -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Teléfono 2
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtTelefono2"
                               value="{{ empresa.telefono2 or '' }}">

                    </div>

                    <!-- MAIL -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Mail
                        </label>

                        <input type="email"
                               class="form-control"
                               name="txtMail"
                               value="{{ empresa.mail or '' }}">

                    </div>

                    <!-- WEB -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Sitio Web
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtSitioWeb"
                               value="{{ empresa.sitioWeb or '' }}">

                    </div>

                    <!-- RED SOCIAL -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Red Social
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtRedSocial"
                               value="{{ empresa.redSocial or '' }}">

                    </div>

                    <!-- RED SOCIAL2 -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Red Social
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtRedSocial2"
                               value="{{ empresa.redSocial2 or '' }}">

                    </div>

                    <!-- RECARGOS -->
                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Recargo Tarjeta %
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="txtRecargoTarjeta"
                               value="{{ empresa.recargoTarjeta or 0 }}">

                    </div>

                    <div class="col-md-3">

                        <label class="form-label fw-bold">
                            Descuento Contado %
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="txtDescuentoContado"
                               value="{{ empresa.descuentoContado or 0 }}">

                    </div>

                    <!-- CLIENTE RAPIDO -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Cliente Rápido
                        </label>

                        <input type="text"
                               class="form-control"
                               name="txtClienteRapido"
                               value="{{ empresa.clienteRapido or '' }}">

                    </div>

                </div>

                <hr>

                <!-- LOGO -->
                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            Logo Empresa
                        </label>

                        <input type="file"
                               class="form-control"
                               name="txtLogo"
                               accept=".jpg,.jpeg,.png">

                    </div>

                    <div class="col-md-6 text-center">

                        <img src="{{ url_for('static', filename='img/logo.jpg') }}"
                             class="img-fluid border p-2"
                             style="max-height:150px;">

                    </div>

                </div>

                <!-- BOTONES -->
                <div class="mt-4">

                    <button class="btn btn-success">
                        Guardar Cambios
                    </button>

                    <a href="{{ url_for('tienda.index') }}"
                       class="btn btn-secondary">

                        Volver

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}

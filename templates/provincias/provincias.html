{% extends 'base.html' %}

{% block content %}

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de Provincias</h3>
        <a href="{{url_for("soporte.create_provincia")}}" class="btn btn-success">Ingresar NUEVA Provincia</a>
    </div>
    <table class="table table-light table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Concepto</th>
                <th>Activo</th>
            </tr>
        </thead>

        <tbody>
            {% for provincia in provincias %}
            <tr>
                <td>{{ provincia.id }}</td>
                
                <td>{{ provincia.concepto }}</td>
                <td>{{ provincia.activo }}</td>
                <td>
                    <a class="btn btn-warning btn-sm"
                    href="{{ url_for('soporte.edit_provincia', id=provincia.id) }}">
                        Editar
                    </a>

                    <a class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Desea borrar la provincia?')"
                    href="{{ url_for('soporte.destroy_provincia', id=provincia.id) }}">
                        Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}

<div class="container" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Crear Nuevo Usuario</h4>
        </div>

        <div class="card-body">
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control campo-edicion" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control campo-edicion" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" required>
                        <option value="admin">Administrador</option>
                        <option value="vendedor">Vendedor</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">
                        Volver
                    </a>

                    <button type="submit" class="btn btn-success">
                        Guardar Usuario
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}

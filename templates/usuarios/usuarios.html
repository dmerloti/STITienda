{% extends 'base.html' %}

{% block content %}

<div class="container">
    <h3>Administración de Usuarios</h3>

    <a href="{{ url_for('seguridad.crear_usuario') }}" class="btn btn-success mb-3">
        Nuevo Usuario
    </a>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for u in usuarios %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.username }}</td>
                <td>{{ u.rol }}</td>
                <td>
                    <a href="/usuarios/editar_usuario/{{ u.id }}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="/usuarios/eliminar/{{ u.id }}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar usuario?')">
                       Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de Roles de Usuario</h3>
    </div>

    <table class="table table-light table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Concepto</th>
            </tr>
        </thead>

        <tbody>
            {% for rol in roles %}
            <tr>
                <td>{{ rol.id }}</td>
                
                <td>{{ rol.concepto }}</td>
                <td>
                
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="container" style="max-width:500px;">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h4 class="mb-0">Editar Usuario</h4>
        </div>

        <div class="card-body">
            <form method="POST">

                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text"
                           name="username"
                           class="form-control campo-edicion"
                           value="{{ usuario.username }}"
                           required>
                </div>

                <!-- Nueva contraseña -->
                <div class="mb-3">
                    <label class="form-label">
                        Nueva Contraseña
                        <small class="text-muted">(dejar vacío para no cambiar)</small>
                    </label>
                    <input type="password"
                           name="password"
                           class="form-control campo-edicion">
                </div>

                <!-- Rol -->
                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="idrol" class="form-select" required>
                        {% for r in roles %}
                            <option value="{{ r.id }}"
                                {% if r.id == usuario.idrol %}selected{% endif %}>
                                {{ r.concepto }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('seguridad.usuarios') }}" class="btn btn-secondary">
                        Volver
                    </a>

                    <button type="submit" class="btn btn-warning">
                        Actualizar Usuario
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}

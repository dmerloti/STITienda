{% extends 'base.html' %}

{% block content %}

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de Países</h3>
        <a href="{{url_for("soporte.create_pais")}}" class="btn btn-success">Ingresar NUEVO País</a>
    </div>

    <table class="table table-light table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Concepto</th>
                <th>Activo</th>
            </tr>
        </thead>

        <tbody>
            {% for pais in paises %}
            <tr>
                <td>{{ pais.id }}</td>
                
                <td>{{ pais.concepto }}</td>
                <td>{{pais.activo }}</td>
                <td>
                    <a class="btn btn-warning btn-sm"
                    href="{{ url_for('soporte.edit_pais', id=pais.id) }}">
                        Editar
                    </a>

                    <a class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Desea borrar el pais?')"
                    href="{{ url_for('soporte.destroy_pais', id=pais.id) }}">
                        Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}

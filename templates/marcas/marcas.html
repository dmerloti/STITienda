{% extends 'base.html' %}

{% block content %}

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de Marcas de Artículos</h3>
        <a href="{{url_for("soporte.create_marca")}}" class="btn btn-success">Ingresar NUEVA Marca</a>
    </div>

    <table class="table table-light table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Concepto</th>
                <th>Activo</th>
            </tr>
        </thead>

        <tbody>
            {% for marca in marcas %}
            <tr>
                <td>{{ marca.id }}</td>
                
                <td>{{ marca.concepto }}</td>
                <td>{{ marca.activo }}</td>
                <td>
                    <a class="btn btn-warning btn-sm"
                    href="{{ url_for('soporte.edit_marca', id=marca.id) }}">
                        Editar
                    </a>

                    <a class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Desea borrar la marca?')"
                    href="{{ url_for('soporte.destroy_marca', id=marca.id) }}">
                        Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Listado de {{ nombre_tabla }}</h3>
        <a href="{{url_for("soporte.create_rubro")}}" class="btn btn-success">Ingresar NUEVO {{nombre_tabla}}</a>
    </div>

    <table class="table table-light table-striped align-middle">
        <thead>
            <tr>
                <th>#</th>
                <th>Concepto</th>
                <th>Activo</th>
            </tr>
        </thead>

        <tbody>
            {% for tablasoporte in tablassoporte %}
            <tr>
                <td>{{ tablasoporte.id }}</td>
                
                <td>{{ tablasoporte.concepto }}</td>
                <td>{{ tablasoporte.activo }}</td>
                <td>
                    <a class="btn btn-warning btn-sm" href="/soporte.edit_rubro/{{ tablasoporte.id }}">
                        Editar
                    </a>
                    <a class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Desea borrar el rubro?')"
                       href="/soporte.destroy_rubro/{{ tablasoporte.id }}">
                        Eliminar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

{% endblock %}
